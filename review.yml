    note: WebAssign/Canvas Examity proctoring enablement guide (LTI SSO integration).
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket (or any server-push) surface exists, and Examity publishes no
    public developer API. The real programmatic surface is a partner-gated LTI
    SSO plus an undocumented integration REST API. No AsyncAPI document was
    created because there is no documented event-driven or streaming transport
    on Examity's own API to model. apis.yml documents the provider honestly as a
    gated integration with modeled (not published) endpoints.
