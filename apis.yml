name: Examity
kind: company
description: Examity is an online exam proctoring and test integrity platform used by
  universities, certification bodies, and enterprises to authenticate test-takers and
  monitor online assessments. It offers automated (AI/ML) proctoring, live proctoring,
  audit-based review, and ID verification, and integrates with learning management
  systems (Canvas, Blackboard, D2L Brightspace, Moodle, Sakai, Schoology, and others).
  Examity's programmatic surface is a partner/LMS integration - single sign-on via
  IMS LTI (consumer key plus shared secret) and a partner integration REST API that
  platform vendors use to register exams, schedule proctoring appointments, launch
  sessions, and retrieve completion status and integrity flags. Access is gated -
  there is no public self-service developer portal, and integration keys plus the
  integration manual are provided on request via developers@examity.com. Because no
  endpoints are publicly documented, the APIs below are modeled from the known
  integration model rather than a published reference.
